name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--no-deps` keeps the build fast; `RUSTDOCFLAGS=-D warnings` (env)
      # turns broken intra-doc links into CI failures.
      - run: cargo doc --no-deps --document-private-items

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # `cargo check --all-targets` exercises lib + tests for the pinned
      # MSRV from `package.rust-version` in Cargo.toml. We don't run the
      # full test suite on MSRV — that's covered by the `test` job.
      # No `--locked`: Cargo.lock is gitignored (library convention),
      # CI resolves fresh each run.
      - run: cargo check --all-targets

  test:
    name: test (PG18 via testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ubuntu-latest GH runners ship Docker pre-installed; `testcontainers`
      # picks it up via the default DOCKER_HOST. Confirm the daemon is up
      # before launching ~120 integration suites.
      - name: Verify Docker is available
        run: docker version
      - name: Pre-pull PG18 image
        run: docker pull postgres:18
      # `--no-fail-fast` so a single flaky integration test doesn't mask
      # the rest. RUST_LOG kept terse (warn-level) to keep CI logs scannable.
      # No `--locked`: Cargo.lock is gitignored (library convention).
      - name: cargo test
        env:
          RUST_LOG: warn,sqlx=warn,pg_work_queue=warn
        run: cargo test --no-fail-fast
